<svg width="246" height="70" viewBox="0 0 246 70" xmlns="http://www.w3.org/2000/svg" font-family="Carlito, sans-serif">
  <rect x="0" y="0" width="246" height="70" fill="transparent" stroke="none" />

  <!-- Top row: Mathematics, Formal Logic, Commonsense -->
  <!-- Chip 1 -->
  <rect x="2" y="2" width="78" height="20" rx="6" fill="white" stroke="#1F3A5F" stroke-width="2"/>
  <g stroke="#1F3A5F" stroke-width="2" stroke-linecap="round">
    <line x1="8" y1="12" x2="16" y2="12"/>
    <line x1="12" y1="8" x2="12" y2="16"/>
    <line x1="8" y1="19" x2="16" y2="19"/>
  </g>
  <text x="20" y="15" font-size="8.5" fill="#222222" data-free="1">Mathematics</text>

  <!-- Chip 2 -->
  <rect x="84" y="2" width="78" height="20" rx="6" fill="white" stroke="#1F3A5F" stroke-width="2"/>
  <g stroke="#1F3A5F" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M 90 17 L 96 17 L 96 7 L 100 7" />
    <path d="M 96 12 L 100 12" />
    <polygon points="102,7 99,5 99,9" fill="#1F3A5F" stroke="none"/>
    <polygon points="102,12 99,10 99,14" fill="#1F3A5F" stroke="none"/>
  </g>
  <text x="105" y="15" font-size="8.5" fill="#222222" data-free="1">Formal Logic</text>

  <!-- Chip 3 -->
  <rect x="166" y="2" width="78" height="20" rx="6" fill="white" stroke="#1F3A5F" stroke-width="2"/>
  <g stroke="#1F3A5F" stroke-width="2" stroke-linecap="round" fill="none">
    <circle cx="176" cy="10" r="4"/>
    <path d="M 174 15 L 178 15 M 175 18 L 177 18" />
  </g>
  <text x="184" y="15" font-size="8.5" fill="#222222" data-free="1">Commonsense</text>

  <!-- Middle section -->
  <text x="110" y="32" font-size="8.5" fill="#222222" text-anchor="end" data-free="1">Difficulty modifiers</text>
  <g stroke="#E8742A" stroke-width="2" fill="none">
    <line x1="123" y1="24" x2="123" y2="32" />
    <polygon points="123,34 120,30 126,30" fill="#E8742A" stroke="none"/>
  </g>
  <text x="136" y="32" font-size="7.1" fill="#222222" text-anchor="start" data-caption="1">each question tagged yes / no</text>

  <!-- Bottom row: 4 chips -->
  <!-- Chip 1: Ambiguity -->
  <rect x="2" y="37" width="58" height="32" rx="6" fill="white" stroke="#1F3A5F" stroke-width="2"/>
  <g stroke="#1F3A5F" stroke-width="1.5" fill="none">
    <path d="M 25 45 Q 25 42 27 42 Q 29 39.5 31 39.5 Q 33 39.5 35 42 Q 37 42 37 45 Q 37 47 35 47 L 27 47 Q 25 47 25 45" />
    <path d="M 30 42.5 A 1 1 0 1 1 32 42.5 C 32 44 31 44 31 45" stroke-width="1" />
    <circle cx="31" cy="46.5" r="0.5" fill="#1F3A5F" stroke="none"/>
  </g>
  <text x="31" y="62" font-size="8.5" fill="#222222" text-anchor="middle" data-free="1">Ambiguity</text>

  <!-- Chip 2: Missing info -->
  <rect x="63" y="37" width="58" height="32" rx="6" fill="white" stroke="#1F3A5F" stroke-width="2"/>
  <g stroke="#1F3A5F" stroke-width="1.5" fill="none">
    <path d="M 87 41 L 90 41 A 2 2 0 1 1 94 41 L 97 41 L 97 44 M 97 46 L 97 47 L 87 47 L 87 41" />
  </g>
  <text x="92" y="55" font-size="7.1" fill="#222222" text-anchor="middle" data-caption="1">Missing</text>
  <text x="92" y="64" font-size="7.1" fill="#222222" text-anchor="middle" data-caption="1">information</text>

  <!-- Chip 3: Contradiction -->
  <rect x="124" y="37" width="58" height="32" rx="6" fill="white" stroke="#1F3A5F" stroke-width="2"/>
  <g stroke="#1F3A5F" stroke-width="1.5" fill="none">
    <line x1="148" y1="41" x2="158" y2="41"/>
    <polygon points="158,41 155,39 155,43" fill="#1F3A5F" stroke="none"/>
    <line x1="158" y1="45" x2="148" y2="45"/>
    <polygon points="148,45 151,43 151,47" fill="#1F3A5F" stroke="none"/>
  </g>
  <text x="153" y="62" font-size="7.1" fill="#222222" text-anchor="middle" data-caption="1">Contradiction</text>

  <!-- Chip 4: Distracting info -->
  <rect x="185" y="37" width="59" height="32" rx="6" fill="white" stroke="#1F3A5F" stroke-width="2"/>
  <g fill="#1F3A5F">
    <circle cx="210" cy="41" r="1.5"/>
    <circle cx="217" cy="42" r="1.5"/>
    <circle cx="213" cy="46" r="1.5"/>
    <circle cx="218" cy="45" r="1.5"/>
  </g>
  <text x="214.5" y="55" font-size="7.1" fill="#222222" text-anchor="middle" data-caption="1">Distracting</text>
  <text x="214.5" y="64" font-size="7.1" fill="#222222" text-anchor="middle" data-caption="1">information</text>

</svg>