<svg width="757" height="105" viewBox="0 0 757 105" xmlns="http://www.w3.org/2000/svg" font-family="Carlito, sans-serif">
  <defs>
    <g id="robot-base">
      <line x1="50" y1="15" x2="50" y2="25" stroke="#1F3A5F" stroke-width="3" stroke-linecap="round"/>
      <circle cx="50" cy="15" r="4" fill="#E8742A" stroke="none"/>
      <rect x="25" y="25" width="50" height="40" rx="6" fill="#F4F6F8" stroke="#1F3A5F" stroke-width="3"/>
      <circle cx="38" cy="38" r="6" fill="white" stroke="#1F3A5F" stroke-width="3"/>
      <circle cx="62" cy="38" r="6" fill="white" stroke="#1F3A5F" stroke-width="3"/>
      <rect x="35" y="65" width="30" height="35" rx="6" fill="#1F3A5F" stroke="none"/>
    </g>
    <g id="audit-thinking">
      <use href="#robot-base" />
      <circle cx="40" cy="36" r="2.5" fill="#1F3A5F" />
      <circle cx="64" cy="36" r="2.5" fill="#1F3A5F" />
      <line x1="46" y1="52" x2="54" y2="52" stroke="#1F3A5F" stroke-width="3" stroke-linecap="round"/>
      <path d="M 35 75 Q 25 80 25 95" stroke="#1F3A5F" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 65 75 Q 75 80 70 55" stroke="#1F3A5F" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
    <g id="audit-card">
      <use href="#robot-base" />
      <circle cx="41" cy="38" r="2.5" fill="#1F3A5F" />
      <circle cx="65" cy="38" r="2.5" fill="#1F3A5F" />
      <line x1="46" y1="52" x2="54" y2="52" stroke="#1F3A5F" stroke-width="3" stroke-linecap="round"/>
      <path d="M 35 75 Q 25 80 25 95" stroke="#1F3A5F" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 65 75 L 85 60" stroke="#1F3A5F" stroke-width="3" fill="none" stroke-linecap="round"/>
      <rect x="72" y="25" width="34" height="38" rx="3" fill="white" stroke="#1F3A5F" stroke-width="3"/>
      <text x="89" y="36" font-size="7.1" fill="#222222" text-anchor="middle" data-caption="1">Answer 1</text>
      <path d="M 80 50 L 85 55 L 94 43" stroke="#3E8E6B" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="audit-mirror">
      <use href="#robot-base" />
      <circle cx="35" cy="38" r="2.5" fill="#1F3A5F" />
      <circle cx="59" cy="38" r="2.5" fill="#1F3A5F" />
      <line x1="46" y1="52" x2="54" y2="52" stroke="#1F3A5F" stroke-width="3" stroke-linecap="round"/>
      <path d="M 35 75 L 15 65" stroke="#1F3A5F" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 65 75 Q 75 80 75 95" stroke="#1F3A5F" stroke-width="3" fill="none" stroke-linecap="round"/>
      <line x1="15" y1="65" x2="5" y2="75" stroke="#1F3A5F" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="18" cy="55" rx="8" ry="12" fill="#F4F6F8" stroke="#1F3A5F" stroke-width="3"/>
      <path d="M 14 50 A 6 9 0 0 1 20 50" stroke="#1F3A5F" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.3"/>
    </g>
    <g id="audit-happy">
      <use href="#robot-base" />
      <circle cx="38" cy="38" r="2.5" fill="#1F3A5F" />
      <circle cx="62" cy="38" r="2.5" fill="#1F3A5F" />
      <path d="M 44 50 Q 50 56 56 50" stroke="#1F3A5F" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 35 72 Q 20 60 20 45" stroke="#1F3A5F" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 65 72 Q 80 60 80 45" stroke="#1F3A5F" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
    <g id="audit-worried">
      <use href="#robot-base" />
      <circle cx="39" cy="41" r="2.5" fill="#1F3A5F" />
      <circle cx="61" cy="41" r="2.5" fill="#1F3A5F" />
      <ellipse cx="50" cy="53" rx="3" ry="4" fill="#1F3A5F" stroke="none"/>
      <path d="M 35 75 Q 25 70 20 50" stroke="#1F3A5F" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 65 75 Q 75 70 80 50" stroke="#1F3A5F" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
  </defs>
  <rect x="0" y="0" width="757" height="105" fill="transparent" stroke="none" />
  
  <!-- Arrows -->
  <g stroke="#E8742A" stroke-width="3" fill="none">
    <line x1="175" y1="45" x2="195" y2="45" />
    <polygon points="195,45 188,40.5 188,49.5" fill="#E8742A" stroke="none" />
    <line x1="330" y1="45" x2="350" y2="45" />
    <polygon points="350,45 343,40.5 343,49.5" fill="#E8742A" stroke="none" />
    <line x1="575" y1="45" x2="595" y2="45" />
    <polygon points="595,45 588,40.5 588,49.5" fill="#E8742A" stroke="none" />
  </g>

  <!-- Scene 1 -->
  <rect x="15" y="10" width="40" height="55" rx="6" fill="white" stroke="#1F3A5F" stroke-width="3"/>
  <text x="35" y="45" font-size="30" fill="#1F3A5F" font-weight="bold" text-anchor="middle">?</text>
  <use href="#audit-thinking" transform="translate(65, 5) scale(0.8)" />
  <text x="85" y="100" font-size="8.5" fill="#222222" text-anchor="middle" data-free="1">math · logic · commonsense</text>

  <!-- Scene 2 -->
  <use href="#audit-card" transform="translate(210, 5) scale(0.8)" />
  <text x="250" y="100" font-size="8.5" fill="#222222" text-anchor="middle" data-free="1">Stage 1</text>

  <!-- Scene 3 -->
  <rect x="360" y="2" width="205" height="101" rx="6" fill="#FDEFE5" />
  <rect x="375" y="20" width="36" height="40" rx="3" fill="white" stroke="#1F3A5F" stroke-width="2"/>
  <text x="393" y="40" font-size="7.1" fill="#222222" text-anchor="middle" data-caption="1">Answer 1</text>
  <use href="#audit-mirror" transform="translate(420, 5) scale(0.8)" />
  <rect x="500" y="12" width="55" height="60" rx="4" fill="white" stroke="#1F3A5F" stroke-width="2"/>
  <rect x="520" y="21" width="16" height="12" rx="2" fill="white" stroke="#1F3A5F" stroke-width="2"/>
  <path d="M 524 21 V 15 A 4 4 0 0 1 532 15 V 21" fill="none" stroke="#1F3A5F" stroke-width="2"/>
  <text x="528" y="45" font-size="7.1" fill="#222222" text-anchor="middle" data-caption="1">No hints.</text>
  <text x="528" y="55" font-size="7.1" fill="#222222" text-anchor="middle" data-caption="1">No answer</text>
  <text x="528" y="65" font-size="7.1" fill="#222222" text-anchor="middle" data-caption="1">key.</text>
  <text x="460" y="100" font-size="8.5" fill="#222222" text-anchor="middle" data-free="1">Stage 2</text>

  <!-- Scene 4 -->
  <rect x="610" y="30" width="40" height="30" rx="3" fill="white" stroke="#1F3A5F" stroke-width="3"/>
  <text x="630" y="42" font-size="7.1" fill="#222222" text-anchor="middle" data-caption="1">Final</text>
  <text x="630" y="54" font-size="7.1" fill="#222222" text-anchor="middle" data-caption="1">answer</text>
  <g stroke="#E8742A" stroke-width="2" fill="none">
    <path d="M 650 45 L 660 20 L 670 20" />
    <path d="M 650 45 L 660 42 L 670 42" />
    <path d="M 650 45 L 660 64 L 670 64" />
    <path d="M 650 45 L 660 86 L 670 86" />
  </g>
  <!-- tags -->
  <g font-size="7.1" fill="#222222">
    <!-- Fixed -->
    <rect x="670" y="11" width="82" height="18" rx="4" fill="#F4F6F8" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="673" y="24" data-caption="1">Fixed</text>
    <path d="M 698 16 L 704 22 M 704 16 L 698 22" stroke="#C0504D" stroke-width="2" fill="none"/>
    <line x1="708" y1="20" x2="714" y2="20" stroke="#E8742A" stroke-width="1.5"/><polygon points="714,20 711,18 711,22" fill="#E8742A"/>
    <path d="M 718 20 L 721 24 L 726 15" stroke="#3E8E6B" stroke-width="2" fill="none"/>
    <use href="#audit-happy" transform="translate(730, 11) scale(0.2)"/>

    <!-- Kept -->
    <rect x="670" y="33" width="82" height="18" rx="4" fill="#F4F6F8" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="673" y="46" data-caption="1">Kept</text>
    <path d="M 698 42 L 701 46 L 706 37" stroke="#3E8E6B" stroke-width="2" fill="none"/>
    <line x1="708" y1="42" x2="714" y2="42" stroke="#E8742A" stroke-width="1.5"/><polygon points="714,42 711,40 711,44" fill="#E8742A"/>
    <path d="M 718 42 L 721 46 L 726 37" stroke="#3E8E6B" stroke-width="2" fill="none"/>
    <use href="#audit-happy" transform="translate(730, 33) scale(0.2)"/>

    <!-- Missed -->
    <rect x="670" y="55" width="82" height="18" rx="4" fill="#F4F6F8" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="673" y="68" data-caption="1">Missed</text>
    <path d="M 698 60 L 704 66 M 704 60 L 698 66" stroke="#C0504D" stroke-width="2" fill="none"/>
    <line x1="708" y1="64" x2="714" y2="64" stroke="#E8742A" stroke-width="1.5"/><polygon points="714,64 711,62 711,66" fill="#E8742A"/>
    <path d="M 718 60 L 724 66 M 724 60 L 718 66" stroke="#C0504D" stroke-width="2" fill="none"/>
    <use href="#audit-worried" transform="translate(730, 55) scale(0.2)"/>

    <!-- Broken -->
    <rect x="670" y="77" width="82" height="18" rx="4" fill="#F4F6F8" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="673" y="90" data-caption="1">Broken</text>
    <path d="M 698 86 L 701 90 L 706 81" stroke="#3E8E6B" stroke-width="2" fill="none"/>
    <line x1="708" y1="86" x2="714" y2="86" stroke="#E8742A" stroke-width="1.5"/><polygon points="714,86 711,84 711,88" fill="#E8742A"/>
    <path d="M 718 82 L 724 88 M 724 82 L 718 88" stroke="#C0504D" stroke-width="2" fill="none"/>
    <use href="#audit-worried" transform="translate(730, 77) scale(0.2)"/>
  </g>
</svg>