<svg width="900" height="900" viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Carlito, sans-serif">
  <defs>
    <!-- Base robot -->
    <g id="robot-base">
      <line x1="50" y1="15" x2="50" y2="25" stroke="#1F3A5F" stroke-width="3" stroke-linecap="round"/>
      <circle cx="50" cy="15" r="4" fill="#E8742A" stroke="none"/>
      <rect x="25" y="25" width="50" height="40" rx="6" fill="#F4F6F8" stroke="#1F3A5F" stroke-width="3"/>
      <circle cx="38" cy="38" r="6" fill="white" stroke="#1F3A5F" stroke-width="3"/>
      <circle cx="62" cy="38" r="6" fill="white" stroke="#1F3A5F" stroke-width="3"/>
      <rect x="35" y="65" width="30" height="35" rx="6" fill="#1F3A5F" stroke="none"/>
    </g>
    <!-- Happy -->
    <g id="audit-happy">
      <use href="#robot-base" />
      <circle cx="38" cy="38" r="2.5" fill="#1F3A5F" />
      <circle cx="62" cy="38" r="2.5" fill="#1F3A5F" />
      <path d="M 44 50 Q 50 56 56 50" stroke="#1F3A5F" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 35 72 Q 20 60 20 45" stroke="#1F3A5F" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 65 72 Q 80 60 80 45" stroke="#1F3A5F" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
    <!-- Worried -->
    <g id="audit-worried">
      <use href="#robot-base" />
      <circle cx="39" cy="41" r="2.5" fill="#1F3A5F" />
      <circle cx="61" cy="41" r="2.5" fill="#1F3A5F" />
      <ellipse cx="50" cy="53" rx="3" ry="4" fill="#1F3A5F" stroke="none"/>
      <path d="M 35 75 Q 25 70 20 50" stroke="#1F3A5F" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 65 75 Q 75 70 80 50" stroke="#1F3A5F" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Column Headers -->
  <text x="332.5" y="110" font-size="40" font-weight="bold" fill="#222222" text-anchor="middle">Final: Correct</text>
  <text x="717.5" y="110" font-size="40" font-weight="bold" fill="#222222" text-anchor="middle">Final: Wrong</text>

  <!-- Row Headers -->
  <g transform="translate(110, 332.5) rotate(-90)">
    <text x="0" y="0" font-size="40" font-weight="bold" fill="#222222" text-anchor="middle">Initial: Correct</text>
  </g>
  <g transform="translate(110, 717.5) rotate(-90)">
    <text x="0" y="0" font-size="40" font-weight="bold" fill="#222222" text-anchor="middle">Initial: Wrong</text>
  </g>

  <!-- Top-Left: CC -->
  <rect x="150" y="150" width="365" height="365" rx="6" fill="#3E8E6B" fill-opacity="0.15" />
  <text x="332.5" y="290" font-size="100" font-weight="bold" fill="#222222" text-anchor="middle">CC</text>
  <text x="332.5" y="335" font-size="36" fill="#6B7280" text-anchor="middle">Correct-to-Correct</text>
  <use href="#audit-happy" transform="translate(267.5, 360) scale(1.3)" />

  <!-- Top-Right: CW -->
  <rect x="535" y="150" width="365" height="365" rx="6" fill="#C0504D" fill-opacity="0.15" />
  <text x="717.5" y="190" font-size="36" font-weight="bold" fill="#E8742A" text-anchor="middle">Damage</text>
  <text x="717.5" y="290" font-size="100" font-weight="bold" fill="#222222" text-anchor="middle">CW</text>
  <text x="717.5" y="335" font-size="36" fill="#6B7280" text-anchor="middle">Correct-to-Wrong</text>
  <use href="#audit-worried" transform="translate(652.5, 360) scale(1.3)" />

  <!-- Bottom-Left: WC -->
  <rect x="150" y="535" width="365" height="365" rx="6" fill="#3E8E6B" fill-opacity="0.15" />
  <text x="332.5" y="575" font-size="36" font-weight="bold" fill="#E8742A" text-anchor="middle">Correction</text>
  <text x="332.5" y="675" font-size="100" font-weight="bold" fill="#222222" text-anchor="middle">WC</text>
  <text x="332.5" y="720" font-size="36" fill="#6B7280" text-anchor="middle">Wrong-to-Correct</text>
  <use href="#audit-happy" transform="translate(267.5, 745) scale(1.3)" />

  <!-- Bottom-Right: WW -->
  <rect x="535" y="535" width="365" height="365" rx="6" fill="#C0504D" fill-opacity="0.15" />
  <text x="717.5" y="675" font-size="100" font-weight="bold" fill="#222222" text-anchor="middle">WW</text>
  <text x="717.5" y="720" font-size="36" fill="#6B7280" text-anchor="middle">Wrong-to-Wrong</text>
  <use href="#audit-worried" transform="translate(652.5, 745) scale(1.3)" />
</svg>
